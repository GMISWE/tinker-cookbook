name: pyright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest

    name: type-check

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: venv
        run: uv venv && uv sync --all-extras

      # This fork's recipes read fields that only the fork's SDK declares (an optimizer step's
      # loss_fn_outputs), so the types come from that SDK, at a pinned commit.
      - name: fork-sdk
        run: uv pip install "tinker @ git+https://github.com/GMISWE/tinker_gmi@e8f89066512c087cb798940a7d29d45fd3ab5df6"

      - name: pyright
        run: uv run --no-sync pyright tinker_cookbook
